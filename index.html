
<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070D19" />
  <meta name="color-scheme" content="dark" />
  <meta name="application-name" content="ORBITAL SHIELD" />
  <meta name="description" content="ORBITAL SHIELD — Advanced Space Domain Awareness and Orbital Simulation Platform." />
  <meta name="robots" content="noindex, nofollow" />

  <title>ORBITAL SHIELD | Space Domain Awareness</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- =====================================================
       ORBITAL SHIELD | APPLICATION BOOT CONFIGURATION
  ====================================================== -->

  <script>
    (() => {
      "use strict";

      const STORAGE = {
        language: "os.language",
        theme: "os.theme"
      };

      const supportedLanguages = ["en", "ar"];

      function readStorage(key, fallback) {
        try {
          return localStorage.getItem(key) || fallback;
        } catch {
          return fallback;
        }
      }

      function writeStorage(key, value) {
        try {
          localStorage.setItem(key, value);
          return true;
        } catch {
          return false;
        }
      }

      const savedLanguage = readStorage(STORAGE.language, "en");
      const savedTheme = readStorage(STORAGE.theme, "dark");

      const initialLanguage = supportedLanguages.includes(savedLanguage)
        ? savedLanguage
        : "en";

      const initialTheme = ["dark", "light"].includes(savedTheme)
        ? savedTheme
        : "dark";

      document.documentElement.lang = initialLanguage;
      document.documentElement.dir =
        initialLanguage === "ar" ? "rtl" : "ltr";

      document.documentElement.dataset.theme = initialTheme;

      const boot = {
        name: "ORBITAL SHIELD",
        version: "2.1.0",
        environment: "LOCAL",
        offlineFirst: true,
        language: initialLanguage,
        direction: initialLanguage === "ar" ? "rtl" : "ltr",
        theme: initialTheme,
        startedAt: Date.now(),
        mounted: false,
        fatalError: false,

        setLanguage(language) {
          if (!supportedLanguages.includes(language)) {
            return false;
          }

          this.language = language;
          this.direction = language === "ar" ? "rtl" : "ltr";

          document.documentElement.lang = language;
          document.documentElement.dir = this.direction;

          writeStorage(STORAGE.language, language);

          window.dispatchEvent(
            new CustomEvent("os:language-change", {
              detail: {
                language,
                direction: this.direction
              }
            })
          );

          return true;
        },

        setTheme(theme) {
          if (!["dark", "light"].includes(theme)) {
            return false;
          }

          this.theme = theme;
          document.documentElement.dataset.theme = theme;

          writeStorage(STORAGE.theme, theme);

          window.dispatchEvent(
            new CustomEvent("os:theme-change", {
              detail: { theme }
            })
          );

          return true;
        },

        reportMounted() {
          this.mounted = true;

          window.dispatchEvent(
            new CustomEvent("os:application-mounted")
          );
        },

        reportError(error) {
          this.fatalError = true;

          window.dispatchEvent(
            new CustomEvent("os:application-error", {
              detail: {
                message: String(error || "Unknown error")
              }
            })
          );
        }
      };

      Object.defineProperty(window, "ORBITAL_BOOT", {
        value: boot,
        writable: false,
        configurable: false
      });
    })();
  </script>

  <!-- =====================================================
       DESIGN SYSTEM
  ====================================================== -->

  <style>
    :root {
      color-scheme: dark;

      --bg: #070D19;
      --bg-deep: #040914;
      --surface: #0D192B;
      --surface-raised: #122238;
      --surface-hover: #172B45;

      --border: rgba(142,185,230,.13);
      --border-strong: rgba(142,185,230,.25);

      --text: #E7F1FF;
      --text-secondary: #9CB4D2;
      --text-muted: #637D9D;

      --blue: #65B5FF;
      --blue-bright: #91D0FF;
      --cyan: #5DE1F5;
      --purple: #8C83FF;

      --green: #45D6A0;
      --yellow: #F4C96B;
      --red: #FF667C;

      --radius-sm: 5px;
      --radius-md: 9px;
      --radius-lg: 14px;
      --radius-xl: 20px;

      --shadow:
        0 24px 80px rgba(0,0,0,.38);

      --glow:
        0 0 28px rgba(75,157,255,.15);

      --font:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      --transition:
        180ms cubic-bezier(.2,.7,.2,1);
    }

    [data-theme="light"] {
      color-scheme: light;

      --bg: #EEF3F9;
      --bg-deep: #E6EDF6;
      --surface: #FFFFFF;
      --surface-raised: #F4F7FB;
      --surface-hover: #E8F0FA;

      --border: rgba(38,75,115,.13);
      --border-strong: rgba(38,75,115,.23);

      --text: #14263C;
      --text-secondary: #536B86;
      --text-muted: #8093A8;

      --blue: #287FCA;
      --blue-bright: #145FAD;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      min-height: 100%;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: #254565 #07101E;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;

      background: var(--bg);
      color: var(--text);

      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }

    ::selection {
      background: rgba(77,157,255,.32);
      color: #fff;
    }

    #root {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      isolation: isolate;
    }

    /* -----------------------------------------------------
       BACKGROUND ENVIRONMENT
    ----------------------------------------------------- */

    .os-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at 50% 45%,
          rgba(35,112,194,.13),
          transparent 43%
        ),
        radial-gradient(
          ellipse at 50% 100%,
          rgba(24,62,115,.13),
          transparent 55%
        ),
        var(--bg-deep);
    }

    .os-stars {
      position: absolute;
      inset: -20%;

      background-image:
        radial-gradient(1px 1px at 8% 16%, #d2e7ff, transparent),
        radial-gradient(1px 1px at 19% 72%, #8cc2ff, transparent),
        radial-gradient(2px 2px at 31% 24%, #ffffff, transparent),
        radial-gradient(1px 1px at 43% 83%, #9acaff, transparent),
        radial-gradient(1px 1px at 59% 12%, #ffffff, transparent),
        radial-gradient(2px 2px at 74% 65%, #8bbaff, transparent),
        radial-gradient(1px 1px at 88% 28%, #ffffff, transparent),
        radial-gradient(1px 1px at 94% 87%, #9acaff, transparent);

      background-size: 340px 340px;
      opacity: .55;

      animation: os-stars-drift 100s linear infinite;
    }

    .os-stars-secondary {
      position: absolute;
      inset: -20%;

      background-image:
        radial-gradient(1px 1px at 15% 35%, #fff, transparent),
        radial-gradient(1px 1px at 65% 18%, #73b9ff, transparent),
        radial-gradient(2px 2px at 82% 74%, #fff, transparent);

      background-size: 420px 420px;
      opacity: .3;
    }

    .os-background-glow {
      position: absolute;
      top: 50%;
      left: 50%;

      width: min(80vw, 900px);
      aspect-ratio: 1;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(35,119,208,.07),
          transparent 68%
        );

      transform: translate(-50%,-50%);
    }

    /* -----------------------------------------------------
       BOOT SCREEN
    ----------------------------------------------------- */

    #os-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: var(--bg-deep);

      opacity: 1;
      visibility: visible;

      transition:
        opacity .65s ease,
        visibility .65s ease;
    }

    #os-loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .os-loader-content {
      position: relative;
      z-index: 2;

      display: flex;
      flex-direction: column;
      align-items: center;

      width: min(92%, 560px);
      text-align: center;
    }

    .os-emblem {
      position: relative;

      display: grid;
      place-items: center;

      width: 140px;
      height: 140px;

      margin-bottom: 28px;
    }

    .os-emblem::before,
    .os-emblem::after {
      position: absolute;
      inset: 0;

      content: "";

      border: 1px solid rgba(111,188,255,.2);
      border-radius: 50%;
    }

    .os-emblem::before {
      animation: os-orbit 12s linear infinite;
    }

    .os-emblem::after {
      inset: 13px;
      border-color: rgba(111,188,255,.13);
      animation: os-orbit 19s linear infinite reverse;
    }

    .os-emblem svg {
      width: 82px;
      height: 82px;

      filter:
        drop-shadow(0 0 16px rgba(82,166,255,.52));
    }

    .os-emblem-dot {
      position: absolute;
      top: 5px;
      left: 65px;

      width: 9px;
      height: 9px;

      border-radius: 50%;
      background: #8ACBFF;

      box-shadow:
        0 0 12px #54AAFF,
        0 0 24px rgba(84,170,255,.55);
    }

    .os-brand-title {
      margin: 0;

      color: #F0F7FF;

      font-size: clamp(22px,5vw,34px);
      font-weight: 400;

      letter-spacing: .29em;
      text-indent: .29em;

      text-shadow:
        0 0 30px rgba(95,174,255,.18);
    }

    .os-brand-subtitle {
      margin: 14px 0 0;

      color: #7899BF;

      font-size: 10px;
      font-weight: 600;

      letter-spacing: .32em;
      text-indent: .32em;
    }

    .os-loader-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      min-height: 22px;
      margin-top: 46px;

      color: #9AB8DB;

      font-size: 10px;
      font-weight: 500;

      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .os-status-light {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;

      border-radius: 50%;
      background: #58B9FF;

      box-shadow: 0 0 12px #58B9FF;

      animation: os-pulse 1.5s ease-in-out infinite;
    }

    .os-progress {
      width: min(300px,76vw);
      height: 2px;

      margin-top: 18px;
      overflow: hidden;

      background: rgba(112,157,207,.15);
    }

    .os-progress-bar {
      width: 38%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          #4C9FFF,
          #B5E3FF,
          transparent
        );

      box-shadow:
        0 0 12px rgba(80,164,255,.65);

      animation: os-progress 1.8s ease-in-out infinite;
    }

    .os-loader-footer {
      position: absolute;
      bottom: max(25px,env(safe-area-inset-bottom));

      z-index: 2;
      width: 100%;

      color: #506B8B;

      font-size: 9px;
      letter-spacing: .19em;
      text-align: center;
    }

    /* -----------------------------------------------------
       LOADER ERROR
    ----------------------------------------------------- */

    #os-error-panel {
      display: none;

      width: min(100%,560px);

      margin-top: 25px;
      padding: 17px 19px;

      border: 1px solid rgba(255,105,105,.3);
      border-radius: var(--radius-md);

      background: rgba(130,35,45,.16);

      color: #FFB7B7;

      font-size: 11px;
      line-height: 1.8;

      text-align: left;
      overflow-wrap: anywhere;
    }

    #os-error-panel.visible {
      display: block;
    }

    .os-error-heading {
      display: block;
      margin-bottom: 6px;

      color: #FF8585;

      font-weight: 700;
      letter-spacing: .1em;
    }

    #os-error-message {
      color: #EABBBB;
      white-space: pre-wrap;
    }

    .os-error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin-top: 13px;
    }

    .os-error-button {
      padding: 8px 12px;

      border: 1px solid rgba(255,150,150,.3);
      border-radius: 6px;

      background: rgba(255,255,255,.06);
      color: #FFE3E3;

      cursor: pointer;
    }

    .os-error-button:hover {
      background: rgba(255,255,255,.12);
    }

    /* -----------------------------------------------------
       ACCESSIBILITY
    ----------------------------------------------------- */

    .os-skip-link {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1000000;

      padding: 10px 16px;

      border-radius: 6px;

      background: #4A9DEB;
      color: #fff;

      transform: translateY(-160%);
      transition: transform var(--transition);
    }

    .os-skip-link:focus {
      transform: translateY(0);
    }

    .os-screen-reader {
      position: absolute;

      width: 1px;
      height: 1px;

      padding: 0;
      margin: -1px;

      overflow: hidden;
      clip: rect(0,0,0,0);

      white-space: nowrap;
      border: 0;
    }

    /* -----------------------------------------------------
       NOSCRIPT
    ----------------------------------------------------- */

    .os-noscript {
      position: fixed;
      inset: 0;
      z-index: 1000001;

      display: grid;
      place-items: center;

      padding: 30px;

      background: #070D19;
      color: #E6F1FF;

      font-family: Arial,sans-serif;
      text-align: center;
    }

    /* -----------------------------------------------------
       RESPONSIVE
    ----------------------------------------------------- */

    @media (max-width:768px) {
      .os-emblem {
        width: 112px;
        height: 112px;
      }

      .os-emblem svg {
        width: 68px;
        height: 68px;
      }

      .os-emblem-dot {
        left: 51px;
      }

      .os-brand-title {
        font-size: 22px;
        letter-spacing: .2em;
        text-indent: .2em;
      }

      .os-brand-subtitle {
        font-size: 8px;
        letter-spacing: .19em;
        text-indent: .19em;
      }

      .os-loader-status {
        margin-top: 36px;
        font-size: 9px;
      }
    }

    @media (max-width:420px) {
      .os-brand-title {
        font-size: 18px;
      }

      .os-loader-footer {
        padding: 0 14px;
        font-size: 8px;
        letter-spacing: .1em;
      }
    }

    @media (prefers-reduced-motion:reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

    @keyframes os-orbit {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes os-pulse {
      50% {
        opacity: .35;
        transform: scale(.72);
      }
    }

    @keyframes os-progress {
      from {
        transform: translateX(-110%);
      }
      to {
        transform: translateX(280%);
      }
    }

    @keyframes os-stars-drift {
      to {
        background-position: 340px 340px;
      }
    }
  </style>
</head>

<body>

       ACCESSIBILITY

  <!-- =====================================================

  <!-- =====================================================

  <div

  <!-- =====================================================
       REACT APPLICATION ROOT
  ====================================================== -->

  <div
    id="root"
    aria-label="ORBITAL SHIELD application"
  ></div>

  <!-- =====================================================
       JAVASCRIPT DISABLED FALLBACK
  ====================================================== -->

  <noscript>
    <div class="os-noscript">
      <div>
        <h1>ORBITAL SHIELD</h1>
        <h2>JavaScript Required</h2>
        <p>
          This platform requires JavaScript to initialize.
        </p>
        <p>
          تتطلب المنصة تفعيل JavaScript حتى تتمكن من العمل.
        </p>
      </div>
    </div>
  </noscript>

  <!-- =====================================================
       BOOT DIAGNOSTICS
  ====================================================== -->

  <script>
    (() => {
      "use strict";

      const CONFIG = Object.freeze({
        minimumDisplayTime: 450,
        startupTimeout: 20000,
        removeDelay: 700
      });

      const startedAt = Date.now();

      const state = {
        mounted: false,
        failed: false,
        loaderRemoved: false,
        errors: [],
        startupDuration: null
      };

      const ui = {
        root: document.getElementById("root"),
        loader: document.getElementById("os-loader"),
        status: document.getElementById("os-status-text"),
        errorPanel: document.getElementById("os-error-panel"),
        errorMessage: document.getElementById("os-error-message"),
        errorHeading: document.getElementById("os-error-heading"),
        reloadButton: document.getElementById("os-reload-button"),
        copyButton: document.getElementById("os-copy-error-button"),
        subtitle: document.getElementById("os-subtitle"),
        footer: document.getElementById("os-footer")
      };

      const translations = {
        en: {
          subtitle: "SPACE DOMAIN AWARENESS SYSTEM",
          status: "INITIALIZING SYSTEM ENVIRONMENT",
          ready: "SYSTEM READY",
          error: "APPLICATION INITIALIZATION ERROR",
          reload: "Reload application",
          copy: "Copy diagnostic",
          footer: "ORBITAL SHIELD ENGINEERING PLATFORM · LOCAL MODE"
        },

        ar: {
          subtitle: "منظومة الوعي بالمجال الفضائي",
          status: "جارٍ تهيئة بيئة النظام",
          ready: "النظام جاهز",
          error: "حدث خطأ أثناء تهيئة التطبيق",
          reload: "إعادة تشغيل التطبيق",
          copy: "نسخ تفاصيل الخطأ",
          footer: "منصة ORBITAL SHIELD الهندسية · التشغيل المحلي"
        }
      };

      function currentLanguage() {
        return window.ORBITAL_BOOT?.language || "en";
      }

      function translateInterface() {
        const language = currentLanguage();
        const words = translations[language] || translations.en;

        if (ui.subtitle) {
          ui.subtitle.textContent = words.subtitle;
        }

        if (ui.status && !state.failed && !state.mounted) {
          ui.status.textContent = words.status;
        }

        if (ui.errorHeading) {
          ui.errorHeading.textContent = words.error;
        }

        if (ui.reloadButton) {
          ui.reloadButton.textContent = words.reload;
        }

        if (ui.copyButton) {
          ui.copyButton.textContent = words.copy;
        }

        if (ui.footer) {
          ui.footer.textContent = words.footer;
        }
      }

      function updateStatus(message) {
        if (!ui.status) return;
        ui.status.textContent = String(message);
      }

      function showError(title, message, details = "") {
        state.failed = true;

        const language = currentLanguage();
        const words = translations[language] || translations.en;

        updateStatus(
          language === "ar"
            ? "تعذر تشغيل النظام"
            : "SYSTEM INITIALIZATION FAILED"
        );

        if (ui.errorHeading) {
          ui.errorHeading.textContent = title || words.error;
        }

        if (ui.errorMessage) {
          ui.errorMessage.textContent = [
            String(message || "Unknown startup error."),
            details ? String(details) : ""
          ].filter(Boolean).join("\n\n");
        }

        if (ui.errorPanel) {
          ui.errorPanel.classList.add("visible");
        }

        state.errors.push({
          time: new Date().toISOString(),
          message: String(message),
          details: String(details || "")
        });
      }

      function hideLoader() {
        if (state.loaderRemoved || !ui.loader) return;

        state.loaderRemoved = true;
        ui.loader.classList.add("is-hidden");

        window.setTimeout(() => {
          ui.loader?.remove();
        }, CONFIG.removeDelay);
      }

      function onApplicationMounted() {
        if (state.mounted || state.failed) return;

        state.mounted = true;
        state.startupDuration = Date.now() - startedAt;

        const elapsed = Date.now() - startedAt;
        const remaining = Math.max(
          0,
          CONFIG.minimumDisplayTime - elapsed
        );

        updateStatus(
          translations[currentLanguage()]?.ready || "SYSTEM READY"
        );

        window.setTimeout(() => {
          hideLoader();
        }, remaining);
      }

      function recordError(type, message, details = "") {
        state.errors.push({
          type,
          time: new Date().toISOString(),
          message: String(message),
          details: String(details || "")
        });
      }

      function onWindowError(event) {
        const message = event?.message || "Unknown browser error.";

        const details = [
          event?.filename || "",
          event?.lineno ? `Line: ${event.lineno}` : "",
          event?.colno ? `Column: ${event.colno}` : ""
        ].filter(Boolean).join("\n");

        recordError("window-error", message, details);

        if (!state.mounted) {
          showError(
            null,
            message,
            details
          );
        }
      }

      function onUnhandledRejection(event) {
        const reason = event?.reason;

        const message = reason?.message
          ? reason.message
          : String(reason || "Unhandled promise rejection.");

        recordError("unhandled-rejection", message);

        if (!state.mounted) {
          showError(null, message);
        }
      }

      function onResourceError(event) {
        const target = event?.target;

        if (!target || target === window) return;

        const tag = target.tagName || "UNKNOWN";
        const source =
          target.src ||
          target.href ||
          "Unknown resource";

        recordError(
          "resource-error",
          `Failed to load ${tag}`,
          source
        );

        if (
          !state.mounted &&
          (tag === "SCRIPT" || tag === "LINK")
        ) {
          showError(
            null,
            `Failed to load ${tag}`,
            source
          );
        }
      }

      function observeRoot() {
        if (!ui.root) {
          showError(
            null,
            "React root element was not found.",
            "Expected HTML element: #root"
          );

          return;
        }

        const observer = new MutationObserver(() => {
          if (ui.root.childElementCount > 0) {
            observer.disconnect();
            onApplicationMounted();
          }
        });

        observer.observe(ui.root, {
          childList: true
        });

        if (ui.root.childElementCount > 0) {
          observer.disconnect();
          onApplicationMounted();
        }
      }

      function getDiagnosticReport() {
        return {
          application: "ORBITAL SHIELD",
          version: window.ORBITAL_BOOT?.version || "unknown",
          language: currentLanguage(),
          direction: document.documentElement.dir,
          theme: document.documentElement.dataset.theme,
          online: navigator.onLine,
          browser: navigator.userAgent,
          viewport: {
            width: window.innerWidth,
            height: window.innerHeight
          },
          startup: {
            mounted: state.mounted,
            failed: state.failed,
            durationMs: state.startupDuration,
            elapsedMs: Date.now() - startedAt
          },
          errors: state.errors
        };
      }

      async function copyDiagnostic() {
        const report = JSON.stringify(
          getDiagnosticReport(),
          null,
          2
        );

        try {
          await navigator.clipboard.writeText(report);

          if (ui.copyButton) {
            ui.copyButton.textContent =
              currentLanguage() === "ar"
                ? "تم النسخ"
                : "Copied";
          }
        } catch {
          if (ui.errorMessage) {
            ui.errorMessage.textContent +=
              "\n\n" + report;
          }
        }
      }

      function initialize() {
        translateInterface();

        window.addEventListener(
          "os:language-change",
          translateInterface
        );

        window.addEventListener(
          "os:application-mounted",
          onApplicationMounted
        );

        window.addEventListener(
          "os:application-error",
          (event) => {
            showError(
              null,
              event?.detail?.message || "Application error"
            );
          }
        );

        window.addEventListener(
          "error",
          onWindowError
        );

        window.addEventListener(
          "unhandledrejection",
          onUnhandledRejection
        );

        document.addEventListener(
          "error",
          onResourceError,
          true
        );

        ui.reloadButton?.addEventListener(
          "click",
          () => window.location.reload()
        );

        ui.copyButton?.addEventListener(
          "click",
          copyDiagnostic
        );

        observeRoot();

        window.setTimeout(() => {
          if (!state.mounted && !state.failed) {
            showError(
              null,
              "Application startup timed out.",
              "The React application did not render into #root. Check the browser console and the Vite terminal. Verify that main.jsx and App.jsx exist and that all imported modules resolve."
            );
          }
        }, CONFIG.startupTimeout);

        window.ORBITAL_DIAGNOSTICS = Object.freeze({
          getReport: getDiagnosticReport,
          getState: () => ({ ...state })
        });

        console.info(
          "%cORBITAL SHIELD",
          "color:#65B5FF;font-size:16px;font-weight:bold"
        );

        console.info(
          "Local application bootstrap initialized.",
          getDiagnosticReport()
        );
      }

      initialize();
    })();
  </script>
